---
schemaVersion: 1
name: officeqa-smartwindow
dataset:
  manifest: ../../../artifacts/aiwindow-trace-eval/officeqa/manifest.json
  cases: []
model:
  kind: custom
  endpoint: http://127.0.0.1:8080/v1
  model: ""
  apiKeyEnv: ""
