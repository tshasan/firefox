<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <title>Page metadata</title>
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link
      rel="stylesheet"
      href="chrome://global/content/pageextractor/metadataViewer.css"
    />
    <script
      type="module"
      src="chrome://global/content/pageextractor/metadataViewer.mjs"
    ></script>
  </head>
  <body>
    <header>
      <h1>What this page says about itself</h1>
      <label
        >Inspecting
        <select id="tab-picker"></select>
      </label>
      <button id="refresh">Read again</button>
    </header>
    <p id="status" role="status"></p>
    <section id="summary"></section>
    <section>
      <h2>Search and social tags</h2>
      <div id="tags"></div>
    </section>
    <section>
      <h2>Structured data</h2>
      <div id="nodes"></div>
    </section>
    <section>
      <h2>JSON-LD blocks</h2>
      <ul id="blocks"></ul>
    </section>
  </body>
</html>
